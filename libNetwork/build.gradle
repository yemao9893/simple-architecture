apply from: "../common_lib_config.gradle"

android {
    namespace "com.ym.network"
    defaultConfig {
        buildConfigField "String","BASE_URL",'"https://www.baitu.com/"'
    }
}

dependencies {

    api project(path: ':libBasic')
    //rxjava
    api 'io.reactivex.rxjava2:rxjava:2.2.19'
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'

    //网络相关 retrofit2.6.x版本支持协程（依赖的okhttp3.12.0），okhttp兼容5.0以下设备最高版本是3.12.x
    api 'com.squareup.retrofit2:retrofit:2.9.0'
    api 'com.squareup.retrofit2:converter-gson:2.6.4'
    api 'com.squareup.okhttp3:logging-interceptor:3.14.4'
}